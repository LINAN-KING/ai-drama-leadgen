<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Microsoft YaHei";src:local("Microsoft YaHei")}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#11100f;color:#f5f0e8;font-family:"IBM Plex Mono","Microsoft YaHei",monospace;letter-spacing:0}
#root{position:relative;width:100%;height:100%;overflow:hidden;background-color:#11100f}
.ambient{position:absolute;border:1px solid #554a41;opacity:.3}.ambient.a{width:55%;height:38%;right:-8%;top:8%;transform:rotate(7deg)}.ambient.b{width:44%;height:48%;left:-12%;bottom:-9%;transform:rotate(-5deg)}
.shell{display:flex;flex-direction:column;width:100%;height:100%;padding:62px;gap:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #554a41;padding-bottom:20px}.brand{font-family:"Microsoft YaHei",sans-serif;font-size:30px;font-weight:800}.status{font-size:20px;color:#f05a47}
.workspace{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-rows:1fr;gap:36px;min-height:0;flex:1}
.editor,.preview{border:2px solid #554a41;background:#201d1a;padding:32px;min-height:0;overflow:hidden}.label{font-size:18px;color:#bdb4a8;margin-bottom:22px}.headline{font-family:"Microsoft YaHei",sans-serif;font-size:52px;line-height:1.25;font-weight:800;max-width:95%}
.input{font-size:25px;line-height:1.55;margin-top:30px;color:#f5f0e8}.process{display:flex;gap:10px;margin-top:32px}.process span{height:8px;flex:1;background:#554a41}.process span.on{background:#f05a47}
.preview{position:relative;display:flex;flex-direction:column;justify-content:space-between}.frame{position:relative;flex:1;min-height:0;border:2px solid #6f6258;background:#171513;overflow:hidden;padding:32px;display:flex;align-items:flex-end}.frame::before{content:"提示词工坊";position:absolute;left:28px;top:24px;font-family:"Microsoft YaHei",sans-serif;font-size:36px;font-weight:800;color:#f5f0e8}.frame::after{content:"";position:absolute;width:46%;aspect-ratio:1;right:8%;top:18%;border:3px solid #f05a47;transform:rotate(12deg);box-shadow:0 0 0 18px rgba(240,90,71,.08)}
.result{position:relative;z-index:2;font-size:24px;line-height:1.4;max-width:78%}.focus{display:flex;justify-content:space-between;gap:20px;font-size:18px;color:#bdb4a8;padding-top:22px}.focus strong{color:#f05a47;font-weight:600}.done{position:absolute;right:28px;top:22px;background:#f05a47;color:#11100f;padding:15px 20px;font-weight:700;font-size:18px;opacity:0}
.cursor{position:absolute;width:44px;height:44px;border:3px solid #f5f0e8;border-radius:50%;left:20%;top:28%;opacity:0}.cursor::after{content:"";position:absolute;width:10px;height:10px;background:#f05a47;border-radius:50%;left:14px;top:14px}
</style></head><body>
<div id="root" data-composition-id="prompt-16x9" data-width="1920" data-height="1080" data-start="0" data-duration="10" data-fps="30" data-track-index="0">
<div class="ambient a" data-layout-ignore></div><div class="ambient b" data-layout-ignore></div><main class="shell"><header class="topbar"><div class="brand">提示词工坊</div><div class="status">AI PIPELINE / 20260813</div></header><section class="workspace"><article class="editor"><div class="label">INPUT / PROMPT</div><div class="headline">玄甲女将踏过燃烧的城门，风雪逆行</div><div class="input">解析主体 / 动作 / 光线 / 镜头</div><div class="process"><span></span><span></span><span></span><span></span></div></article><article class="preview"><div class="label">GENERATED RESULT</div><div class="frame"><div class="result">电影级东方奇幻关键帧</div><div class="cursor"></div></div><div class="focus"><span>CAMERA FOCUS</span><strong>动作与轮廓一致性</strong></div><div class="done">✓ COMPLETE</div></article></section></main></div>
<script>
window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
tl.from('.topbar',{y:-28,opacity:0,duration:.55,ease:'expo.out'},.2).from('.editor',{x:-44,opacity:0,duration:.68,ease:'power3.out'},.34).from('.headline',{y:38,opacity:0,duration:.62,ease:'back.out(1.2)'},.62).from('.input',{opacity:0,duration:.5,ease:'sine.out'},1.15);
tl.to('.process span:nth-child(1)',{backgroundColor:'#f05a47',duration:.25,ease:'power1.inOut'},1.7).to('.process span:nth-child(2)',{backgroundColor:'#f05a47',duration:.25,ease:'power2.inOut'},2.2).to('.process span:nth-child(3)',{backgroundColor:'#f05a47',duration:.25,ease:'power3.inOut'},2.7).to('.process span:nth-child(4)',{backgroundColor:'#f05a47',duration:.25,ease:'expo.inOut'},3.2);
tl.from('.preview',{x:52,opacity:0,duration:.7,ease:'power4.out'},4.1).from('.frame',{scale:.94,opacity:0,duration:.62,ease:'back.out(1.15)'},4.35).from('.result',{y:32,opacity:0,duration:.52,ease:'circ.out'},4.72);
tl.set('.cursor',{opacity:1},6.2).fromTo('.cursor',{x:0,y:0},{x:260,y:90,duration:1.15,ease:'power2.inOut'},6.2).from('.focus',{y:20,opacity:0,duration:.48,ease:'expo.out'},6.48);
tl.fromTo('.done',{opacity:0,scale:.9},{opacity:1,scale:1,duration:.42,ease:'back.out(1.6)'},8.1).to('.ambient.a',{rotation:10,duration:9.4,ease:'none'},.3).to('.ambient.b',{rotation:-8,duration:9.2,ease:'none'},.4);
window.__timelines['prompt-16x9']=tl;
</script></body></html>
